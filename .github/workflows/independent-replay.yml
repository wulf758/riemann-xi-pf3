name: Independent PF3 replay

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r artifact-v1/requirements.txt
      - name: Verify the untouched frozen artifact
        working-directory: artifact-v1
        run: python replay.py --verify-only > verify-original.json
      - name: Create Linux audit copy and normalize serialized Windows paths
        run: |
          cp -a artifact-v1 audit-artifact
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('audit-artifact/research/riemann/h1319_full_xi_compact_interval_certificate.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          changed = 0
          for row in data['r_proof_chain']['segments']:
              normalized = row['path'].replace('\\', '/')
              if normalized != row['path']:
                  row['path'] = normalized
                  changed += 1
          if changed == 0:
              raise SystemExit('No Windows-style paths were found to normalize')
          path.write_text(json.dumps(data, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(f'normalized_paths={changed}')
          PY
      - name: Replay H1325 primary assembly
        working-directory: audit-artifact
        run: python tools/rh_h1325_xi_global_d3_h811_assembly.py --no-write > h1325-primary.json
      - name: Replay H1325 independent audit
        working-directory: audit-artifact
        run: python tools/rh_h1325_xi_global_d3_h811_independent_audit.py > h1325-independent.json
      - name: Replay complete H1325 fail-closed package
        working-directory: audit-artifact
        run: python tools/rh_h1325_fail_closed_manifest.py --no-write > h1325-fail-closed.json
      - name: Replay complete H1326 PF3 completion package
        working-directory: audit-artifact
        run: python tools/rh_h1326_fail_closed_manifest.py > h1326-fail-closed.json
      - name: Build independent audit summary
        working-directory: audit-artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = [
              'h1325-primary.json',
              'h1325-independent.json',
              'h1325-fail-closed.json',
              'h1326-fail-closed.json',
          ]
          reports = {name: json.loads(Path(name).read_text(encoding='utf-8')) for name in files}
          summary = {
              'classification': 'independent_linux_pf3_replay_pass',
              'all_checks_pass': all(report.get('all_checks_pass') is True for report in reports.values()),
              'reports': {
                  name: {
                      'classification': report.get('classification'),
                      'all_checks_pass': report.get('all_checks_pass'),
                  }
                  for name, report in reports.items()
              },
          }
          if not summary['all_checks_pass']:
              summary['classification'] = 'independent_linux_pf3_replay_failed'
          Path('independent-summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(summary, indent=2, sort_keys=True))
          raise SystemExit(0 if summary['all_checks_pass'] else 1)
          PY
      - name: Upload replay reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-replay-reports
          path: |
            artifact-v1/verify-original.json
            audit-artifact/h1325-primary.json
            audit-artifact/h1325-independent.json
            audit-artifact/h1325-fail-closed.json
            audit-artifact/h1326-fail-closed.json
            audit-artifact/independent-summary.json
