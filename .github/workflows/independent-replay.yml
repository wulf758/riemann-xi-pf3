name: Independent PF3 replay

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r artifact-v1/requirements.txt
      - name: Verify manifest and environment
        working-directory: artifact-v1
        run: python replay.py --verify-only
      - name: Run full fail-closed replay
        working-directory: artifact-v1
        run: python replay.py
